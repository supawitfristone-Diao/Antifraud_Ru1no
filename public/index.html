<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบป้องกันการโกงออนไลน์ - ค้นหาประวัติ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">Anti-Fraud System</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto" id="nav-links"></ul>
            </div>
        </div>
    </nav>
    <div class="container mt-5 mb-5">
        <div class="text-center mb-4">
            <h2 class="fw-bold">ค้นหาประวัติคนโกง</h2>
            <p class="text-muted">ตรวจสอบ ชื่อ-นามสกุล, เบอร์โทรศัพท์ หรือ เลขบัญชีธนาคาร ก่อนทำการโอนเงิน</p>
        </div>
        <div class="row justify-content-center mb-4">
            <div class="col-md-8 col-lg-6">
                <form id="searchForm" onsubmit="handleSearch(event)">
                    <div class="input-group">
                        <input type="text" id="searchInput" class="form-control form-control-lg" placeholder="พิมพ์ชื่อ, เบอร์โทร, หรือเลขบัญชี..." required>
                        <button class="btn btn-primary btn-lg px-4" type="submit">ค้นหา</button>
                    </div>
                </form>
            </div>
        </div>
        <div class="row justify-content-center">
            <div class="col-md-10">
                <div id="searchResult" class="d-none">
                    <h4 class="mb-3 fw-bold">ผลการค้นหา</h4>
                    <div id="resultsList" class="row g-3"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        async function handleSearch(e) {
            e.preventDefault();
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            const resultDiv = document.getElementById('searchResult');
            const resultsList = document.getElementById('resultsList');
            
            resultDiv.classList.remove('d-none');
            resultsList.innerHTML = '<div class="col-12 text-center py-4"><div class="spinner-border text-primary" role="status"></div><p class="mt-2 text-muted">กำลังค้นหาข้อมูล...</p></div>';

            try {
                const res = await fetch(`/api/reports/search?q=${encodeURIComponent(query)}`);
                const data = await res.json();

                if (!res.ok) {
                    resultsList.innerHTML = `<div class="col-12"><div class="alert alert-danger">${data.error || 'เกิดข้อผิดพลาดในการค้นหา'}</div></div>`;
                    return;
                }

                if (data.length === 0) {
                    resultsList.innerHTML = `
                        <div class="col-12">
                            <div class="alert alert-success text-center py-4">
                                <h5 class="fw-bold mb-1">ไม่พบข้อมูลประวัติการโกง</h5>
                                <p class="mb-0 text-muted">ไม่พบข้อมูลตรงกับคำค้นหาในระบบ (โปรดใช้วิจารณญาณก่อนโอนเงิน)</p>
                            </div>
                        </div>`;
                    return;
                }

                resultsList.innerHTML = data.map(item => `
                    <div class="col-12">
                        <div class="card border-0 shadow-sm rounded-3">
                            <div class="card-body p-4">
                                <div class="d-flex justify-content-between align-items-start mb-2">
                                    <h5 class="card-title text-danger fw-bold mb-0">${item.suspect_name}</h5>
                                    <span class="badge bg-danger">พบประวัติการโกง</span>
                                </div>
                                <hr class="my-2 text-secondary">
                                <div class="row mt-3">
                                    <div class="col-md-6 mb-2">
                                        <strong>เบอร์โทรศัพท์:</strong> ${item.suspect_phone || '-'}
                                    </div>
                                    <div class="col-md-6 mb-2">
                                        <strong>เลขบัญชีธนาคาร:</strong> ${item.bank_account || '-'}
                                    </div>
                                    <div class="col-md-6 mb-2">
                                        <strong>มูลค่าความเสียหาย:</strong> <span class="text-danger fw-bold">${item.damage_amount ? item.damage_amount.toLocaleString() + ' บาท' : 'ไม่ระบุ'}</span>
                                    </div>
                                    <div class="col-md-6 mb-2">
                                        <strong>รายละเอียด:</strong> ${item.details || '-'}
                                    </div>
                                </div>
                                ${item.evidence_path ? `
                                    <div class="mt-3">
                                        <a href="/uploads/${item.evidence_path}" target="_blank" class="btn btn-sm btn-outline-info">
                                            ดูหลักฐานแนบ
                                        </a>
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                `).join('');

            } catch (err) {
                console.error(err);
                resultsList.innerHTML = '<div class="col-12"><div class="alert alert-danger">ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์ได้</div></div>';
            }
        }
    </script>
</body>
</html>
