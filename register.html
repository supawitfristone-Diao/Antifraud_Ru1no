<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>สมัครสมาชิก - ระบบป้องกันการโกงออนไลน์</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Anti-Fraud System</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto" id="nav-links">
                </ul>
            </div>
        </div>
    </nav>
    
    <div class="container mt-5" id="app-content">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h3 class="text-center mb-4">สมัครสมาชิก</h3>
                        <div id="authAlert" class="alert d-none"></div>
                        
                        <form id="registerForm">
                            <div class="mb-3">
                                <label class="form-label">ชื่อ - นามสกุล</label>
                                <input type="text" id="reg_name" class="form-control" placeholder="กรุณากรอกชื่อ-นามสกุล" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">เบอร์โทรศัพท์</label>
                                <input type="text" id="reg_phone" class="form-control" placeholder="กรุณากรอกเบอร์โทรศัพท์" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">รหัสผ่าน</label>
                                <input type="password" id="reg_password" class="form-control" placeholder="กรุณากรอกรหัสผ่าน" required>
                            </div>
                            <button type="submit" class="btn btn-success w-100 py-2 fw-bold">สมัครสมาชิก</button>
                        </form>
                        
                        <div class="text-center mt-3">
                            <small class="text-muted">มีบัญชีอยู่แล้ว? <a href="login.html">เข้าสู่ระบบที่นี่</a></small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
