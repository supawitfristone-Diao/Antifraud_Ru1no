<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แจ้งเบาะแสคนโกง - ระบบป้องกันการโกงออนไลน์</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Anti-Fraud System</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto" id="nav-links">
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h3 class="text-center mb-4 fw-bold">แจ้งเบาะแสคนโกง</h3>

                        <!-- กล่องแจ้งเตือน Alert -->
                        <div id="reportAlert" class="alert d-none"></div>

                        <form id="reportForm">
                            <div class="mb-3">
                                <label class="form-label fw-bold">ชื่อ-นามสกุล คนโกง <span class="text-danger">*</span></label>
                                <input type="text" id="suspect_name" class="form-control" placeholder="เช่น นาย สมชาย ใจดี" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">เบอร์โทรศัพท์คนโกง</label>
                                <input type="text" id="suspect_phone" class="form-control" placeholder="เช่น 0812345678">
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">เลขบัญชีธนาคาร</label>
                                <input type="text" id="bank_account" class="form-control" placeholder="เช่น 123-4-56789-0">
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">จำนวนเงินความเสียหาย (บาท)</label>
                                <input type="number" id="damage_amount" class="form-control" placeholder="เช่น 500" step="any">
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">รายละเอียดเหตุการณ์</label>
                                <textarea id="details" class="form-control" rows="3" placeholder="อธิบายรายละเอียด เช่น สั่งซื้อของแล้วไม่ส่ง"></textarea>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-bold">แนบหลักฐาน (รูปภาพ / สลิป / แชท)</label>
                                <input type="file" id="evidence_file" class="form-control" accept="image/*">
                            </div>

                            <button type="submit" class="btn btn-warning w-100 py-2 fw-bold text-dark">ส่งข้อมูลแจ้งโกง</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
